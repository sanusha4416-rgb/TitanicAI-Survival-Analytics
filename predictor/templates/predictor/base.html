
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TitanicAI{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'predictor/css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Main Background -->
    <div class="site-wrapper">

        <!-- Navigation -->
        <header class="main-header">
            <nav class="navbar navbar-expand-lg custom-navbar">
                <div class="container-fluid">

                    <a class="navbar-brand brand-logo" href="/">
                        <span class="brand-icon">✦</span>
                        Titanic<span class="brand-highlight">AI</span>
                    </a>

                    <button class="navbar-toggler custom-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#mainNavbar"
                            aria-controls="mainNavbar"
                            aria-expanded="false"
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="mainNavbar">
                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="/">Home</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="#about">About</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="#features">Features</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'analytics' %}">Analytics</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'history' %}">History</a>
                            </li>
                        </ul>

                        <div class="nav-actions">
                            <a href="/login/" class="btn btn-outline-blue">
                                Login
                            </a>

                            <a href="/register/" class="btn btn-primary-blue">
                                Get Started
                            </a>
                        </div>
                    </div>

                </div>
            </nav>
        </header>

        <!-- Page Content -->
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>
                © 2026 TitanicAI.
                Built with Django and Machine Learning.
            </p>
        </footer>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
